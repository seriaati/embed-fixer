name: Pyrefly

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - embed_fixer/**.py
      - run.py
      - ci.py
      - pyproject.toml
      - uv.lock
      - .github/workflows/pyrefly.yml
  pull_request:
    branches:
      - main
    paths:
      - embed_fixer/**.py
      - run.py
      - ci.py
      - pyproject.toml
      - uv.lock
      - .github/workflows/pyrefly.yml

jobs:
  pyrefly:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1

      - name: Install Project
        run: uv sync --frozen && uv pip install pyrefly

      - name: Run Pyrefly
        run: uv run pyrefly check --output-format full-text-with-github

name: Docker Build

permissions:
  contents: read

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - .dockerignore
      - .github/workflows/docker-build.yml
      - .github/workflows/pyrefly.yml
      - Dockerfile
      - docker-bake.hcl
      - embed_fixer/**
      - entrypoint.sh
      - l10n/**
      - migrations/**
      - pyproject.toml
      - run.py
      - uv.lock
  push:
    branches:
      - main
    paths:
      - .dockerignore
      - .github/workflows/docker-build.yml
      - .github/workflows/pyrefly.yml
      - Dockerfile
      - docker-bake.hcl
      - embed_fixer/**
      - entrypoint.sh
      - l10n/**
      - migrations/**
      - pyproject.toml
      - run.py
      - uv.lock
    tags:
      - "v*"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  checks:
    uses: ./.github/workflows/pyrefly.yml

  docker-build:
    needs: checks
    name: Build ARM64 (${{ matrix.variant.target }})
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        variant:
          - target: bot
            suffix: ""
          - target: bot-asyncpg
            suffix: "-asyncpg"
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: suffix=${{ matrix.variant.suffix }},onlatest=true
          tags: |
            type=ref,event=branch,suffix=${{ matrix.variant.suffix }}
            type=ref,event=pr,suffix=${{ matrix.variant.suffix }}
            type=semver,pattern={{version}},suffix=${{ matrix.variant.suffix }}
            type=semver,pattern={{major}}.{{minor}},suffix=${{ matrix.variant.suffix }}
            type=semver,pattern={{major}},suffix=${{ matrix.variant.suffix }}
            type=sha,suffix=${{ matrix.variant.suffix }},enable=${{ github.ref_type == 'branch' }}
            type=raw,value=latest,suffix=${{ matrix.variant.suffix }},enable=${{ github.ref_name == 'main' }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1
        with:
          version: latest

      - name: Login to GitHub Container Registry
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        uses: docker/login-action@v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build ARM64 image
        uses: docker/bake-action@v7.5.0
        with:
          source: .
          files: |
            ./docker-bake.hcl
            cwd://${{ steps.meta.outputs.bake-file }}
          targets: ${{ matrix.variant.target }}
          set: |
            *.output=${{ github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) && 'type=registry' || 'type=cacheonly' }}
            *.cache-from=type=gha,version=2,scope=${{ matrix.variant.target }}-arm64
            *.cache-to=type=gha,version=2,mode=max,scope=${{ matrix.variant.target }}-arm64

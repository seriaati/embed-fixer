[project]
authors = [{ name = "seriaati", email = "seria.ati@gmail.com" }]
dependencies = [
  "aiofiles>=24.1.0",
  "jishaku>=2.5.2",
  "python-dotenv>=1.0.1",
  "pyyaml>=6.0.2",
  "tortoise-orm>=0.21.6",
  "uvloop>=0.20.0; platform_system == 'Linux'",
  "discord-py>=2.4.0",
  "loguru>=0.7.2",
  "pydantic>=2.10.4",
  "redis[hiredis]>=6.2.0",
  "aiohttp-client-cache>=0.13.0",
  "aiosqlite==0.22.1",
  "iso639-lang>=2.6.3",
  "emoji>=2.15.0",
  "sentry-sdk>=2.39.0",
  "tomli>=2.2.1",
  "pydantic-settings>=2.11.0",
  "anyio>=4.12.1",
  "pillow>=11.0.0",
  "ffmpeg-python>=0.2.0",
]
description = "Discord bot that fixes social media embeds"
license = { file = "LICENSE" }
name = "embed-fixer"
readme = "README.md"
requires-python = ">=3.11"
version = "1.9.8"

[project.optional-dependencies]
asyncpg = ["asyncpg>=0.31.0"]

[tool.pyrefly]
project-excludes = ["migrations", "**/node_modules", "**/__pycache__", "**/.*", ".venv"]
infer-with-first-use = false
enabled-ignores = ["pyrefly"]

[tool.pyrefly.errors]
unnecessary-comparison = "error"
incompatible-comparison = "error"
bad-override = "ignore"
redundant-condition = "error"
unused-ignore = "error"

[[tool.pyrefly.sub-config]]
matches = "embed_fixer/models.py"
errors = { bad-assignment = "ignore" }

[dependency-groups]
dev = [
    "asyncpg>=0.31.0",
    "pytest>=9.2.0",
    "pytest-aiohttp>=1.1.1",
    "pytest-asyncio>=1.4.1.post1",
    "pytest-cov>=7.1.0",
    "pytest-socket>=0.8.1",
    "types-aiofiles>=25.1.0.20260518",
    "types-pyyaml>=6.0.12.20260906",
    "uvloop>=0.22.1 ; sys_platform == 'darwin'",
]

[tool.tortoise]
tortoise_orm = "embed_fixer.core.db_config.TORTOISE_ORM"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "--strict-markers --strict-config --disable-socket --allow-unix-socket --allow-hosts=127.0.0.1,::1"

[tool.coverage.run]
branch = true
source = ["embed_fixer", "run", "ci"]

[tool.coverage.report]
fail_under = 95
show_missing = true
skip_covered = true

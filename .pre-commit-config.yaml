repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.3
    hooks:
      - id: ruff
      - id: ruff-format
  - repo: local
    hooks:
      - id: pytest
        name: unit and regression tests with coverage
        entry: uv run --locked pytest --cov --cov-report=term-missing
        language: system
        pass_filenames: false
        always_run: true
        require_serial: true
        stages: [pre-commit]
ci:
  skip: [pytest]
  autoupdate_commit_msg: "ci: update pre-commit hooks"
  autofix_commit_msg: "fix: auto-fix from pre-commit hooks"
